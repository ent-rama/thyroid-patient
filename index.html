<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thyroid Patient</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f4f7fb;--ink:#1b2a3a;--muted:#5f7186;--brand:#3a84c4;--brand-dark:#1f4e79;--line:#dbe5ef}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Sarabun',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink)}
  .wrap{max-width:560px;margin:0 auto;padding:20px}
  h1{font-size:28px;line-height:1.3;color:var(--brand-dark);margin:0}
  .sub{color:var(--muted);font-size:17px;margin:4px 0 16px}
  .banner{display:block;width:100%;height:auto;border-radius:18px}
  .card{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:18px;margin-top:16px}
  .card p{margin:0 0 10px;font-size:17px;line-height:1.7}
  .card p:last-child{margin-bottom:0}
  .note{color:var(--muted);font-size:15px}
  .btn{display:block;width:100%;height:58px;line-height:58px;text-align:center;margin-top:16px;border-radius:18px;background:var(--brand);color:#fff;font-weight:700;font-size:20px;text-decoration:none}
</style>
